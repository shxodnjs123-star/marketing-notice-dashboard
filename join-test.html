<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>애드보감 회원가입 테스트</title><style>body{font:16px system-ui;background:#f7f6f2;color:#233f33;margin:0;padding:24px}main{max-width:480px;margin:auto;background:white;padding:24px;border-radius:16px;border:1px solid #ddd}label{display:block;margin:12px 0}input:not([type=checkbox]),select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font:inherit}button{padding:12px;width:100%;border:0;border-radius:8px;background:#233f33;color:white;font:inherit;cursor:pointer;margin:8px 0}#login{background:#fee500;color:#191919}fieldset{border:1px solid #ddd;border-radius:8px}small{line-height:1.5}a{color:inherit}</style><main><a href="./">애드보감 홈</a><h1>회원가입 테스트</h1><p>개발용 테스트입니다. 실제 회원 모집 전 개인정보 안내 및 약관을 확정할 예정입니다.</p><button id="login" hidden>카카오 로그인</button><form id="form" hidden><label>닉네임 <input name="nickname" required maxlength="30"></label><label>소속 <select name="member_type" required><option value="">선택</option><option value="advertiser">광고주 (인하우스)</option><option value="agency">광고대행사 (에이전시)</option><option value="media">매체사</option><option value="other">기타</option></select></label><label><span id="companyLabel">회사명 (선택)</span><input name="company" maxlength="100"><small>회사명은 내부 회원 관리용이며 공개되지 않습니다.</small></label><label>직급 (선택)<select name="job_title"><option value="">선택 안 함</option><option>대표·임원</option><option>직원</option><option>기타</option></select></label><fieldset><legend>관심 분야 (복수 선택)</legend><div id="interests"></div></fieldset><button id="submit">테스트 가입 완료</button></form><button id="logout" hidden>로그아웃</button><p id="status" role="status">연결 중</p><a id="home" href="./" hidden>홈페이지로 이동</a></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const client=createClient('https://ptkrqqedijyaqdehfbrx.supabase.co','sb_publishable_m4GZf2GeuZDxbrsh4xZ44A_QLbb0ohB',{auth:{flowType:'pkce'}});
const $=id=>document.getElementById(id),form=$('form');let user;
for(const x of ['디지털 광고','영상·방송','옥외광고','교통광고','생활밀착 광고','인쇄·음성','바이럴·PR','BTL 광고']){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.name='interests';i.value=x;l.append(i,' '+x);$('interests').append(l)}
function companyRule(){const required=['advertiser','agency','media'].includes(form.elements.member_type.value)&&['대표·임원','직원'].includes(form.elements.job_title.value);form.elements.company.required=required;$('companyLabel').textContent='회사명 ('+(required?'필수':'선택')+')';}form.elements.member_type.addEventListener('change',companyRule);form.elements.job_title.addEventListener('change',companyRule);companyRule();
async function refresh(){const {data,error}=await client.auth.getUser();user=data?.user;$('login').hidden=!!user;$('logout').hidden=!user;form.hidden=true;$('home').hidden=true;if(!user){$('status').textContent='로그인 대기 중';return}const p=await client.from('profiles').select('id,nickname').eq('id',user.id).maybeSingle();if(p.error){$('status').textContent='회원정보 조회 실패: '+p.error.message;return}if(p.data){$('status').textContent=p.data.nickname+'님, 가입 정보 확인 완료';$('home').hidden=false}else{$('status').textContent='추가 정보를 입력해 주세요.';form.hidden=false}}
$('login').onclick=async()=>{const {error}=await client.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+'/join-test.html',scopes:'account_email'}});if(error)$('status').textContent=error.message};
$('logout').onclick=async()=>{const {error}=await client.auth.signOut();if(error)$('status').textContent=error.message;else await refresh()};
form.onsubmit=async e=>{e.preventDefault();if(!user)return;const d=new FormData(form),nickname=String(d.get('nickname')).trim();if(!nickname)return;if(form.elements.company.required&&!String(d.get('company')).trim()){$('status').textContent='회사명을 입력해 주세요.';return;}$('submit').disabled=true;const {error}=await client.from('profiles').insert({id:user.id,nickname,member_type:d.get('member_type'),company:String(d.get('company')).trim()||null,job_title:String(d.get('job_title')).trim()||null,interests:d.getAll('interests')});$('submit').disabled=false;if(error){$('status').textContent='저장 실패: '+error.message;return}await refresh()};
await client.auth.getSession();await refresh();
</script></html>
