<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marketing Insight</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172334;font:15px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:32px 20px}header{margin-bottom:24px}h1{font-size:30px;letter-spacing:-1px;margin:0}p{color:#64748b;margin:4px 0}section{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{padding:15px;background:#f8fafc;border-radius:10px;color:#64748b}.stats strong{display:block;font-size:27px;color:#172334}button,input,select{font:inherit;border:1px solid #dce3eb;border-radius:8px;padding:9px 13px;background:white;color:inherit}button{cursor:pointer}button.active{background:#172334;color:white}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}input{width:100%}article{padding:17px 0;border-bottom:1px solid #edf0f4}article a{font-size:16px;color:#172334;text-decoration:none;font-weight:650}article a:hover{text-decoration:underline}small{color:#64748b} .meta{display:flex;gap:10px;align-items:center;margin-bottom:4px}.date{margin-left:auto}.new{color:#dc2626;font-size:10px;font-weight:700}footer{text-align:center;color:#94a3b8;padding:20px}.sources{display:flex;flex-wrap:wrap;gap:12px}.sources a{color:#475569} @media(max-width:500px){main{padding:20px 12px}section{padding:14px}.stats div{padding:10px}}
nav button{font-weight:750;border:1px solid var(--edge,#cbd5e1);background:var(--pale,#f1f5f9);color:var(--ink,#334155);transition:background .15s,box-shadow .15s}nav button.active{background:var(--accent,#172334);color:var(--selected,#fff);border-color:var(--accent,#172334);box-shadow:0 2px 5px #0002}nav button:hover{box-shadow:0 0 0 2px var(--edge,#cbd5e1)}.naver{--accent:#008a45;--pale:#e5f8ed;--ink:#08743d;--edge:#a4dfbc}.kakao{--accent:#fee500;--pale:#fff9d5;--ink:#725900;--edge:#e5ce50;--selected:#332800}.meta-tab{--accent:#1769d2;--pale:#e7f1ff;--ink:#1859ac;--edge:#b3d2fa}.google{--accent:#bd3979;--pale:#fce8f2;--ink:#a32963;--edge:#edb5d0}.platform-label{background:var(--pale,#f1f5f9);color:var(--ink,#334155);padding:2px 8px;border-radius:5px;font-weight:650}.report{--accent:#7651af;--pale:#f1eafa;--ink:#624098;--edge:#cfbce9}.favorite-tab{--accent:#b77909;--pale:#fff8df;--ink:#a66d00;--edge:#ecd28b;font-size:20px;line-height:1}.star{border:0;background:transparent;padding:0 4px;font-size:22px;line-height:1;color:#94a3b8}.star.saved{color:#d99a08}.star:hover{color:#b77909}.star svg,.favorite-tab svg{width:21px;height:21px;display:block;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;fill:none}.star.saved svg,.favorite-tab svg{fill:#fbbf24;stroke:#d99a08}.favorite-tab.active svg{fill:#fff3bf;stroke:#fff3bf}.star{padding:5px;border-radius:7px}.star:hover{background:#fff8df}.favorite-tab{display:inline-flex;align-items:center;justify-content:center;min-width:44px}.tab-separator{display:inline-block;align-self:center;width:1px;height:23px;background:#cbd5e1;margin:0 3px;flex-shrink:0}.favorite-tab,.favorite-tab.active,.star,.star:hover{background:transparent!important;border-color:transparent!important;box-shadow:none!important}.favorite-tab svg{width:30px;height:30px}.star svg{width:26px;height:26px}.favorite-tab.active svg{fill:#fbbf24;stroke:#a66d00;stroke-width:2.5}.favorite-tab:focus-visible,.star:focus-visible{outline:2px solid #b77909;outline-offset:2px}header{margin-bottom:12px}#updated{display:block;text-align:right;font-size:11px;color:#64748b}.issues{padding:14px 20px}.issues h2{font-size:15px;margin:0}.issue-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #edf0f4}.issue-row:last-child{border:0}.issue-row a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#172334;text-decoration:none;font-size:13px}.issue-row a:hover{text-decoration:underline}.issue-row small{white-space:nowrap}.list-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.list-controls select{font-size:12px;padding:5px 8px}#pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}#pager[hidden]{display:none}#pager button{padding:5px 12px}#pager button:disabled{opacity:.4;cursor:default}.issue-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.issue-heading button{font-size:12px;padding:4px 8px;color:#475569}.issue-heading button[hidden]{display:none}#feed article{padding:10px 0}#feed .meta{margin-bottom:2px;gap:8px}#feed .star{padding:0 4px}#feed article p{margin:2px 0 0;line-height:1.4}#feed article a{line-height:1.45}#feed article a{font-size:14px;font-weight:600}#feed .meta small{font-size:11px}#feed .meta .new{font-size:10px}#feed article p{font-size:11px!important}</style><main><header><h1 id="brand">MARKETING INSIGHT</h1><p id="desc"></p><small id="updated">수집 데이터 확인 중</small></header><section class="issues"><div class="issue-heading"><h2>LATEST ISSUES <small> · 최근 7일</small></h2><button id="issueToggle" type="button" hidden aria-expanded="false" aria-controls="issues"></button></div><div id="issues"></div></section><section><nav id="tabs"></nav><input id="q" placeholder="공지 제목 및 키워드 검색" aria-label="검색"><div class="list-controls"><p id="result"></p><select id="pageSize" aria-label="페이지당 게시물 수"><option value="10">10개 보기</option><option value="20">20개 보기</option><option value="50">50개 보기</option><option value="100">100개 보기</option></select></div><div id="feed"></div><div id="pager" hidden></div></section><section><strong>공식 정보 출처</strong><p>수집 결과가 없는 매체는 원문에서 확인하세요.</p><div class="sources" id="sources"></div></section><footer id="foot"></footer></main><script>
const $=id=>document.getElementById(id), platforms=['★','전체','네이버 SA','네이버 GFA','네이버 공통','카카오모먼트','Meta','Google','마케팅 리포트'];let active='전체',rows=[],page=1,pageSize=10;
const sources={'네이버 SA':'https://ads.naver.com/notice','네이버 GFA':'https://ads.naver.com/notice','카카오모먼트':'https://lounge-board.kakao.com/bulletin/list?serviceType=KAKAOMOMENT','Meta':'https://www.facebook.com/business/news','Google':'https://blog.google/products/ads-commerce/','마케팅 리포트':'https://www.adic.or.kr/lit/report/list.do'};
function platformClass(p){return p==='★'?'favorite-tab':p.startsWith('네이버')?'naver':p==='카카오모먼트'?'kakao':p==='Meta'?'meta-tab':p==='Google'?'google':p==='마케팅 리포트'?'report':'all'}
function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}
function classify(n){if(n.platform==='NAVER'){let t=n.title; if(/디스플레이 광고|GFA|쇼핑 고객 확장/.test(t))return '네이버 GFA';if(/검색광고|파워링크|신제품검색|브랜드검색/.test(t))return '네이버 SA';return '네이버 공통'}return ({KAKAO:'카카오모먼트',META:'Meta',GOOGLE:'Google',REPORT:'마케팅 리포트'})[n.platform]||n.platform}
const favStore='marketing-insight-favorites-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(favStore)||'{}')||{}}catch(e){} 
function starIcon(button){button.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.55 4.45 1.08 6.28L12 17.4l-5.63 2.93 1.08-6.28L2.9 9.6l6.3-.9z"/></svg>'}
function favKey(n){return n.platform+'|'+(n.platform==='NAVER'?n.url.split('?')[0]:n.url)}
function toggleFav(n){let k=favKey(n);if(saved[k])delete saved[k];else saved[k]=n;try{localStorage.setItem(favStore,JSON.stringify(saved))}catch(e){alert('브라우저 저장소를 사용할 수 없어 즐겨찾기가 새로고침 후 유지되지 않을 수 있습니다.')}render()}
function clean(t){return t.replace(/\s+(?:new\s+)?(?:검색광고|디스플레이 광고|공통|디지털옥외광고)\s+20\d{2}-\d{2}-\d{2}$/i,'')}
function isNew(date){const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});const age=(Date.parse(today)-Date.parse(date))/86400000;return age>=0&&age<7}
let issuesExpanded=false;function renderIssues(){let box=$('issues');box.replaceChildren();let all=rows.filter(n=>isNew(n.date)&&n.group!=='카카오모먼트');let toggle=$('issueToggle');toggle.hidden=all.length<=5;toggle.textContent=issuesExpanded?'접기 −':'전체 '+all.length+'건 보기 +';toggle.setAttribute('aria-expanded',String(issuesExpanded));toggle.onclick=()=>{issuesExpanded=!issuesExpanded;renderIssues()};let recent=issuesExpanded?all:all.slice(0,5);for(let n of recent){let row=el('div','');row.className='issue-row';let label=el('small',n.platform==='REPORT'?(n.publisher||n.group):n.group);label.className='platform-label '+platformClass(n.group);let a=el('a',n.ko||n.title);a.title=n.ko||n.title;if(/^https:\/\//.test(n.url)){a.href=n.url;a.target='_blank';a.rel='noopener noreferrer'}let badge=el('small','NEW');badge.className='new';row.append(label,a,badge);box.append(row)}if(!recent.length)box.append(el('p','최근 7일 내 수집된 소식이 없습니다.'))}
function renderPager(total){let box=$('pager');box.replaceChildren();box.hidden=total<=1;let prev=el('button','이전'),next=el('button','다음');prev.disabled=page===1;next.disabled=page===total;function go(p){page=p;render();$('tabs').scrollIntoView({block:'start'})}prev.onclick=()=>go(page-1);next.onclick=()=>go(page+1);box.append(prev);let start=Math.max(1,Math.min(page-2,total-4));for(let i=start;i<=Math.min(total,start+4);i++){let b=el('button',String(i));b.className=i===page?'active':'';b.onclick=()=>go(i);box.append(b)}box.append(next,el('small',page+' / '+total))}
function render(){if(active==='카카오모먼트'){$('q').hidden=true;$('pageSize').hidden=true;$('pager').hidden=true;$('result').textContent='수동 확인 · 카카오 계정 로그인 필요';$('feed').replaceChildren();let p=el('p','카카오모먼트 공지는 로그인 후 열람할 수 있어 자동 수집 대상에서 제외했습니다. 공식 공지사항에서 최신 소식을 확인해 주세요.');let a=el('a','카카오모먼트 공식 공지사항 바로가기 ↗');a.href=sources['카카오모먼트'];a.target='_blank';a.rel='noopener noreferrer';a.style.display='inline-block';a.style.marginTop='14px';a.style.color='#172334';a.style.fontWeight='700';$('feed').append(p,a);return}$('q').hidden=false;$('pageSize').hidden=false;let q=$('q').value.toLowerCase();let pool=active==='★'?Object.values(saved).map(n=>rows.find(x=>favKey(x)===favKey(n))||n).sort((a,b)=>b.date.localeCompare(a.date)):rows;let a=pool.filter(n=>(active==='★'||active==='전체'||n.group===active)&&(n.title+' '+(n.ko||'')).toLowerCase().includes(q));let total=Math.max(1,Math.ceil(a.length/pageSize));page=Math.min(page,total);$('result').textContent=a.length+'건 · 최신순';renderPager(total);$('feed').replaceChildren();for(let n of a.slice((page-1)*pageSize,page*pageSize)){let ar=el('article',''),m=el('div','');m.className='meta';let label=el('small',n.platform==='REPORT'?(n.publisher||n.group):n.group);label.className='platform-label '+platformClass(n.group);m.append(label);if(isNew(n.date)){let badge=el('small','NEW');badge.className='new';m.append(badge)}let d=el('small',n.date);d.className='date';m.append(d);let star=el('button',saved[favKey(n)]?'★':'☆');star.className='star'+(saved[favKey(n)]?' saved':'');starIcon(star);star.type='button';star.setAttribute('aria-pressed',String(!!saved[favKey(n)]));star.setAttribute('aria-label',saved[favKey(n)]?'즐겨찾기 해제':'즐겨찾기 추가');star.title=star.getAttribute('aria-label');star.onclick=()=>toggleFav(n);m.append(star);ar.append(m);let link=el('a',n.ko||n.title);if(/^https:\/\//.test(n.url)){link.href=n.url;link.target='_blank';link.rel='noopener noreferrer'}ar.append(link);if(n.ko){let original=el('p',n.title);original.style.fontSize='12px';ar.append(original)}$('feed').append(ar)}if(!a.length)$('feed').append(el('p',active==='★'?'즐겨찾기한 게시물이 없습니다. 게시물의 별표를 눌러 보관하세요.':'표시할 수집 게시물이 없습니다.'))}
for(let p of platforms){if(['네이버 SA','카카오모먼트','Meta','Google','마케팅 리포트'].includes(p)){let sep=el('span','');sep.className='tab-separator';sep.setAttribute('aria-hidden','true');$('tabs').append(sep)}let b=el('button',p);b.className=platformClass(p)+(p===active?' active':'');if(p==='★'){starIcon(b);b.title='즐겨찾기';b.setAttribute('aria-label','즐겨찾기')}b.onclick=()=>{active=p;page=1;for(let x of $('tabs').children)x.classList.toggle('active',x===b);render()};$('tabs').append(b)}for(let [p,u] of Object.entries(sources)){let a=el('a',p+' ↗');a.href=u;a.target='_blank';a.rel='noopener';$('sources').append(a)}$('q').oninput=()=>{page=1;render()};$('pageSize').onchange=()=>{pageSize=Number($('pageSize').value);page=1;render()};
fetch('brand.json').then(r=>r.json()).then(b=>{$('brand').textContent=b.name;document.title=b.name;$('desc').textContent=b.description;$('foot').textContent=b.company?'© '+b.company:''});
Promise.all([fetch('data/notices.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('translations.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,tr])=>{let map=new Map();for(let n of d.notices){let url=n.url.split('?')[0];if(n.platform!=='NAVER')url=n.url;let key=n.platform+url;let item={...n,title:clean(n.title),group:classify(n),ko:tr[n.id]||n.title_ko||''};let old=map.get(key);if(!old||item.title.includes('수정'))map.set(key,item)}rows=[...map.values()].sort((a,b)=>b.date.localeCompare(a.date));$('updated').textContent='마지막 데이터 기록: '+(d.updated_at||'미수집')+' · 카카오모먼트 수동 확인';renderIssues();render()}).catch(()=>{$('updated').textContent='데이터 로딩 실패';render()});
</script></html>
