<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marketing Insight</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172334;font:15px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:32px 20px}header{margin-bottom:24px}h1{font-size:30px;letter-spacing:-1px;margin:0}p{color:#64748b;margin:4px 0}section{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{padding:15px;background:#f8fafc;border-radius:10px;color:#64748b}.stats strong{display:block;font-size:27px;color:#172334}button,input,select{font:inherit;border:1px solid #dce3eb;border-radius:8px;padding:9px 13px;background:white;color:inherit}button{cursor:pointer}button.active{background:#172334;color:white}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}input{width:100%}article{padding:17px 0;border-bottom:1px solid #edf0f4}article a{font-size:16px;color:#172334;text-decoration:none;font-weight:650}article a:hover{text-decoration:underline}small{color:#64748b} .meta{display:flex;gap:10px;align-items:center;margin-bottom:4px}.date{margin-left:auto}.new{color:#087d52;font-weight:700}footer{text-align:center;color:#94a3b8;padding:20px}.sources{display:flex;flex-wrap:wrap;gap:12px}.sources a{color:#475569} @media(max-width:500px){main{padding:20px 12px}section{padding:14px}.stats div{padding:10px}}
nav button{font-weight:750;border:1px solid var(--edge,#cbd5e1);background:var(--pale,#f1f5f9);color:var(--ink,#334155);transition:background .15s,box-shadow .15s}nav button.active{background:var(--accent,#172334);color:var(--selected,#fff);border-color:var(--accent,#172334);box-shadow:0 2px 5px #0002}nav button:hover{box-shadow:0 0 0 2px var(--edge,#cbd5e1)}.naver{--accent:#008a45;--pale:#e5f8ed;--ink:#08743d;--edge:#a4dfbc}.kakao{--accent:#fee500;--pale:#fff9d5;--ink:#725900;--edge:#e5ce50;--selected:#332800}.meta-tab{--accent:#1769d2;--pale:#e7f1ff;--ink:#1859ac;--edge:#b3d2fa}.google{--accent:#bd3979;--pale:#fce8f2;--ink:#a32963;--edge:#edb5d0}.platform-label{background:var(--pale,#f1f5f9);color:var(--ink,#334155);padding:2px 8px;border-radius:5px;font-weight:650}</style><main><header><h1 id="brand">MARKETING INSIGHT</h1><p id="desc"></p></header><section><small id="updated">수집 데이터 확인 중</small><div class="stats"><div>최근 24시간<strong id="today">–</strong></div><div>전체 게시물<strong id="total">–</strong></div><div>수집 확인 매체<strong id="count">–</strong></div></div></section><section><nav id="tabs"></nav><input id="q" placeholder="공지 제목 및 키워드 검색" aria-label="검색"><p id="result"></p><div id="feed"></div></section><section><strong>공식 정보 출처</strong><p>수집 결과가 없는 매체는 원문에서 확인하세요.</p><div class="sources" id="sources"></div></section><footer id="foot"></footer></main><script>
const $=id=>document.getElementById(id), platforms=['전체','네이버 SA','네이버 GFA','네이버 공통','카카오모먼트','Meta','Google'];let active='전체',rows=[];
const sources={'네이버 SA':'https://ads.naver.com/notice','네이버 GFA':'https://ads.naver.com/notice','카카오모먼트':'https://lounge-board.kakao.com/bulletin/list?serviceType=KAKAOMOMENT','Meta':'https://www.facebook.com/business/news','Google':'https://blog.google/products/ads-commerce/'};
function platformClass(p){return p.startsWith('네이버')?'naver':p==='카카오모먼트'?'kakao':p==='Meta'?'meta-tab':p==='Google'?'google':'all'}
function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}
function classify(n){if(n.platform==='NAVER'){let t=n.title; if(/디스플레이 광고|GFA|쇼핑 고객 확장/.test(t))return '네이버 GFA';if(/검색광고|파워링크|신제품검색|브랜드검색/.test(t))return '네이버 SA';return '네이버 공통'}return ({KAKAO:'카카오모먼트',META:'Meta',GOOGLE:'Google'})[n.platform]||n.platform}
function clean(t){return t.replace(/\s+(?:new\s+)?(?:검색광고|디스플레이 광고|공통|디지털옥외광고)\s+20\d{2}-\d{2}-\d{2}$/i,'')}
function isNew(date){const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});const age=(Date.parse(today)-Date.parse(date))/86400000;return age>=0&&age<7}
function render(){if(active==='카카오모먼트'){$('q').hidden=true;$('result').textContent='수동 확인 · 카카오 계정 로그인 필요';$('feed').replaceChildren();let p=el('p','카카오모먼트 공지는 로그인 후 열람할 수 있어 자동 수집 대상에서 제외했습니다. 공식 공지사항에서 최신 소식을 확인해 주세요.');let a=el('a','카카오모먼트 공식 공지사항 바로가기 ↗');a.href=sources['카카오모먼트'];a.target='_blank';a.rel='noopener noreferrer';a.style.display='inline-block';a.style.marginTop='14px';a.style.color='#172334';a.style.fontWeight='700';$('feed').append(p,a);return}$('q').hidden=false;let q=$('q').value.toLowerCase();let a=rows.filter(n=>(active==='전체'||n.group===active)&&(n.title+' '+(n.ko||'')).toLowerCase().includes(q));$('result').textContent=a.length+'건 · 최신순';$('feed').replaceChildren();for(let n of a){let ar=el('article',''),m=el('div','');m.className='meta';let label=el('small',n.group);label.className='platform-label '+platformClass(n.group);m.append(label);if(isNew(n.date)){let badge=el('small','NEW');badge.className='new';m.append(badge)}let d=el('small',n.date);d.className='date';m.append(d);ar.append(m);let link=el('a',n.ko||n.title);if(/^https:\/\//.test(n.url)){link.href=n.url;link.target='_blank';link.rel='noopener noreferrer'}ar.append(link);if(n.ko){let original=el('p',n.title);original.style.fontSize='12px';ar.append(original)}$('feed').append(ar)}if(!a.length)$('feed').append(el('p','표시할 수집 게시물이 없습니다.'))}
for(let p of platforms){let b=el('button',p);b.className=platformClass(p)+(p===active?' active':'');b.onclick=()=>{active=p;for(let x of $('tabs').children)x.classList.toggle('active',x===b);render()};$('tabs').append(b)}for(let [p,u] of Object.entries(sources)){let a=el('a',p+' ↗');a.href=u;a.target='_blank';a.rel='noopener';$('sources').append(a)}$('q').oninput=render;
fetch('brand.json').then(r=>r.json()).then(b=>{$('brand').textContent=b.name;document.title=b.name;$('desc').textContent=b.description;$('foot').textContent=b.company?'© '+b.company:''});
Promise.all([fetch('data/notices.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('translations.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,tr])=>{let map=new Map();for(let n of d.notices){let url=n.url.split('?')[0];if(n.platform!=='NAVER')url=n.url;let key=n.platform+url;let item={...n,title:clean(n.title),group:classify(n),ko:tr[n.id]||n.title_ko||''};let old=map.get(key);if(!old||item.title.includes('수정'))map.set(key,item)}rows=[...map.values()].sort((a,b)=>b.date.localeCompare(a.date));$('updated').textContent='마지막 데이터 기록: '+(d.updated_at||'미수집')+' · 카카오모먼트는 수동 확인';$('total').textContent=rows.length;$('count').textContent=new Set(rows.map(n=>n.platform)).size;$('today').textContent=rows.filter(n=>n.date===new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'})).length;render()}).catch(()=>{$('updated').textContent='데이터 로딩 실패';render()});
</script></html>
