name: Update marketing notices

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths: [scraper.py, .github/workflows/update.yml]
  workflow_dispatch:

concurrency:
  group: marketing-notice-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Crawl notices
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add data/notices.json
          git diff --cached --quiet || git commit -m "chore: update marketing notices"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
